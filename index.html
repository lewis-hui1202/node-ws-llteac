<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>llteac | Tech</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at top, #0f2027, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 背景科技线条 */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px),
        linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .logo {
      position: relative;
      font-size: 120px;
      font-weight: 800;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #e0f7ff;
      text-shadow:
        0 0 10px rgba(0, 200, 255, 0.8),
        0 0 30px rgba(120, 0, 255, 0.6);
    }

    /* 3D 立体层 */
    .logo::before,
    .logo::after {
      content: "llteac";
      position: absolute;
      left: 0;
      top: 0;
      z-index: -1;
    }

    .logo::before {
      color: #0ff;
      transform: translate(4px, 4px);
      filter: blur(4px);
      opacity: 0.6;
    }

    .logo::after {
      color: #6a00ff;
      transform: translate(8px, 8px);
      filter: blur(8px);
      opacity: 0.4;
    }

    /* 呼吸光效动画 */
    @keyframes glow {
      0% {
        text-shadow:
          0 0 10px rgba(0, 200, 255, 0.6),
          0 0 30px rgba(120, 0, 255, 0.4);
      }
      100% {
        text-shadow:
          0 0 20px rgba(0, 255, 255, 1),
          0 0 50px rgba(150, 0, 255, 0.9);
      }
    }

    .logo {
      animation: glow 3s ease-in-out infinite alternate;
    }
  </style>
</head>
<body>
  <div class="logo">llteac</div>
</body>
</html>
